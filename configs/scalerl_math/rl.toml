# ScaleRL recipe smoke config — Qwen3-8B on Hendrycks Math
#
# Mirrors the seven ScaleRL ingredients (arxiv 2510.13786) we ship in this
# fork, on the upstream `math-env`. Used internally to smoke-test the recipe
# end-to-end before handing the public POC to Snowflake.
#
# Features active here:
#   1. Async Pipeline-RL (max_async_level = 8, strict_async_level = false)
#   2. CISPO loss (canonical Minimax form, eps_max = 4)
#   3. Prompt-level loss averaging (prompt_average_loss = true,
#      loss_scale_mode = "sequence")
#   4. Batch-level advantage normalization (advantage.normalization = "batch")
#   5. FP32 LM-head on both trainer and inference
#   6. Zero-variance filtering (upstream ZeroAdvantageFilter, default)
#   7. No-Positive-Resampling (threshold = 0.9 per Polaris)

max_steps = 500
seq_len = 8192
# Per-run output directory. Override via `--output-dir <path>` so multiple
# concurrent submissions don't collide on `outputs/` (validate_output_dir
# rejects re-using a populated dir).
output_dir = "outputs/scalerl_math"

# ScaleRL §3.1: how far the trainer is allowed to lead the generators. k = 8
# matches the paper's PipelineRL-8 ablation winner. strict_async_level = false
# uses "freshest stable checkpoint up to k" rather than pinning at exactly k.
max_async_level = 8

[deployment]
# Tuned for our 4xB200 cluster (8 GPUs/node). Override for other layouts.
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "Qwen/Qwen3-8B"

# Wandb disabled for the smoke run — enable by uncommenting below and
# running `wandb login` / setting WANDB_API_KEY in .env first.
# [wandb]
# project = "scalerl-prime-rl"
# name = "scalerl-math-smoke-qwen3-8b"

[ckpt]
interval = 100
# Cap retention so a long run doesn't fill the cache with Qwen3-8B + optimizer
# state checkpoints (~16+ GB each). Keep the 3 most-recent steps for quick
# resume, plus every 500-step milestone. Tune for your storage budget.
keep_last = 3
keep_interval = 500

# NCCL broadcast at max_async_level=8 requires the experimental opt-in flag
# (validated on B200/EFA per ScaleRL Pipeline-RL §3.1).
[weight_broadcast]
type = "nccl"

[orchestrator]
# ScaleRL paper uses 48 prompts × 16 rollouts = 768 completions/step. The math
# config is the SMOKE run — deliberately smaller (256/16 = 16 prompts/step,
# 1/3 of the paper) so a single 8-GPU node finishes a step in tens of seconds.
# For paper-faithful runs use configs/scalerl_terminal_bench/rl.toml or bump
# to 768 here.
batch_size = 256
rollouts_per_example = 16
strict_async_level = false
# Paper Pipeline-RL semantics: in-flight rollouts continue under fresh weights
# rather than being cancelled past k updates. Upstream default is 8 (cancels);
# 1e9 = "never cancel."
max_off_policy_steps = 1000000000
# ScaleRL §3.3: every prompt contributes equally to the loss step.
prompt_average_loss = true

[orchestrator.experimental]
# Required when weight_broadcast.type = "nccl" and max_async_level != 1.
# Validated on B200/EFA per ScaleRL Pipeline-RL §3.1; other hardware may need
# `weight_broadcast.type = "filesystem"` instead.
allow_nccl_async_level_override = true

[orchestrator.train.sampling]
temperature = 1.0
# ScaleRL §2 budget: 12,288 thinking tokens (paper says 12k thinking + 2k solution
# + 2k prompt = 16,384). We use seq_len=8192 here for smoke speed; bump for paper-faithful.
max_completion_tokens = 6144

[[orchestrator.train.env]]
id = "math-env"
name = "hendrycks-math"
args = { dataset_name = "PrimeIntellect/Hendrycks-Math", dataset_subset = "default", math_verify_max_workers = 128, math_verify_timeout = 60 }

[orchestrator.advantage]
type = "default"
# ScaleRL §3.4: per-group center, divide by batch-wide std.
normalization = "batch"

[orchestrator.buffer]
# DELIBERATELY no easy_threshold / hard_threshold:
#   * Paper-faithful zero-variance filtering happens per-step via the default
#     ZeroAdvantageFilter (already in OrchestratorConfig.filters), which drops
#     groups whose advantages collapse to zero (all-correct or all-failed in
#     the binary case). Filtering does NOT remove the prompt from future
#     sampling — the prompt stays in rotation and contributes to the NPR
#     pass-rate average.
#   * The only permanent eviction the paper specifies is NPR (§3.6, easy-side
#     only): once a prompt's Welford-cumulative pass rate crosses
#     no_positive_resampling_threshold, it leaves the pool.
#   * Adding `easy_threshold` or `hard_threshold` runs `update_pools` BEFORE
#     `update_pass_rate`, which (a) introduces a second permanent-eviction
#     mechanism not in the paper, (b) skips NPR's cumulative average update
#     for evicted groups, and (c) the smoke configs previously had
#     `hard_threshold=0.0` permanently evicting all-zero prompts — pure
#     deviation from the paper's per-step variance filter.
no_positive_resampling = true
no_positive_resampling_threshold = 0.9
# Math config has thousands of prompts, so single-group lucky-shot eviction
# is a small fraction of the pool — but it's still a single observation
# permanently removing a prompt. Default 1 (preserves upstream behavior)
# would inflate variance on the early-step pass-rate; 4 mirrors the TB
# config and matches "history of pass rates" in ScaleRL §3.6.
no_positive_resampling_min_groups = 4

# ZeroAdvantageFilter is in upstream's default filter list — no need to specify.
# Verify with `prime_rl.configs.orchestrator.OrchestratorConfig().filters`.

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
temperature = 0.6
top_p = 0.95
max_completion_tokens = 6144

[[orchestrator.eval.env]]
id = "math500"
num_examples = 100
rollouts_per_example = 4

[trainer]
# torch.set_float32_matmul_precision("high") (the upstream default on Ampere+)
# transparently runs FP32 matmuls in TF32 — fast, but loses bits the FP32
# LM-head exists to keep. "highest" forces true FP32 matmul, so the
# `fp32_lm_head=true` path actually computes in fp32 instead of being
# silently relaxed to TF32.
matmul_precision = "highest"

[trainer.model]
# FA4 via the HF AttentionInterface bridge in trainer/model.py. impl="hf"
# routes dense Qwen3 through the stock transformers model with our
# `_fa4_attention_forward` (ported from baker; same FA4 git rev abd9943b).
# `attn = "fa4"` + `impl = "custom"` is also valid for MoE variants but
# dense Qwen3 isn't registered in AutoModelForCausalLMPrimeRL today.
attn = "fa4"
impl = "hf"
# Match vLLM inference dtype to avoid optimizer/inference numerical drift.
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
# ScaleRL §3.2 / MiniMax-M1 §3.2: LM-head matmul + grad accumulator in fp32.
# Reduces train/inference logprob mismatch from ~0.9 to >0.99 correlation.
fp32_lm_head = true
# Chunk the LM head to fit Qwen3-8B's 152k vocab on B200 without OOM.
fused_lm_head_token_chunk_size = 8192

[trainer.model.ac]
freq = 6

[trainer.optim]
# ScaleRL paper: AdamW eps=1e-15 (Wortsman et al. 2023; default 1e-8 underflows
# at MiniMax-M1's reported gradient magnitudes) + constant lr 5e-7 + wd 0.01.
lr = 5e-7
eps = 1e-15
weight_decay = 0.01

[trainer.scheduler]
# ScaleRL §3.1: 100-step linear warmup into the constant lr=5e-7 phase. The
# linear scheduler with `decay_steps = 0` keeps the LR at 1.0×base after the
# warmup window — torch.optim.lr_scheduler.LinearLR caps at `end_factor` once
# `total_iters` is reached, so this is effectively warmup→constant.
type = "linear"
warmup_steps = 100
decay_steps = 0

[trainer.loss]
# Canonical Minimax-CISPO (ScaleRL §3.2). eps_max ablation says insensitive
# in {4, 5, 8}; pick 4.
type = "cispo"
eps_max = 4.0
adv_tau = 1.0
# Pair with prompt_average_loss — sequence weights pre-encode the per-prompt
# normalization, so compute_loss does sum_i w_i * loss_i without an extra
# token-count divide.
loss_scale_mode = "sequence"

[inference]

[inference.parallel]
dp = 4

[inference.model]
fp32_lm_head = true
